name: Update release info

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Determine current vs. latest version
        id: ver
        env:
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "release" ]; then
            latest_tag="$RELEASE_TAG"
          else
            # Manual dispatch: ask the API what the latest published release is.
            latest_tag=$(curl -sfL \
              -H "Authorization: Bearer ${{ github.token }}" \
              "https://api.github.com/repos/${REPO}/releases/latest" \
              | jq -r .tag_name)
          fi
          latest_version=${latest_tag#v}
          current_version=$(grep -oP '(?<=version = ")[^"]+' nix/kaledis-release.nix | head -1)

          echo "latest=$latest_version" >> "$GITHUB_OUTPUT"
          echo "current=$current_version" >> "$GITHUB_OUTPUT"

          if [ "$latest_version" != "$current_version" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch new release asset hashes
        if: steps.ver.outputs.changed == 'true'
        id: hashes
        env:
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.ver.outputs.latest }}
        run: |
          set -euo pipefail

          declare -A suffix=(
            [x86_64-linux]=linux-x86_64
            [x86_64-darwin]=macos-x86_64
            [aarch64-darwin]=macos-aarch64
          )

          for system in "${!suffix[@]}"; do
            key=${system//-/_}
            url="https://github.com/${REPO}/releases/download/v${VERSION}/kaledis-${VERSION}-${suffix[$system]}.tar.gz"
            echo "Fetching $url"
            hash=$(nix --extra-experimental-features 'nix-command flakes' \
              store prefetch-file --json "$url" | jq -r .hash)
            {
              echo "${key}_url=$url"
              echo "${key}_hash=$hash"
            } >> "$GITHUB_OUTPUT"
          done

      - name: Write nix/kaledis-release.nix
        if: steps.ver.outputs.changed == 'true'
        run: |
          cat > nix/kaledis-release.nix <<EOF
          # Generated by .github/workflows/update-release-info.yml — do not hand-edit.
          # \`version\` and each asset's \`sha256\` are regenerated automatically
          # whenever a new release is published on this repository.
          {
            version = "${{ steps.ver.outputs.latest }}";
            assets = {
              x86_64-linux = {
                url = "${{ steps.hashes.outputs.x86_64_linux_url }}";
                sha256 = "${{ steps.hashes.outputs.x86_64_linux_hash }}";
              };
              x86_64-darwin = {
                url = "${{ steps.hashes.outputs.x86_64_darwin_url }}";
                sha256 = "${{ steps.hashes.outputs.x86_64_darwin_hash }}";
              };
              aarch64-darwin = {
                url = "${{ steps.hashes.outputs.aarch64_darwin_url }}";
                sha256 = "${{ steps.hashes.outputs.aarch64_darwin_hash }}";
              };
            };
          }
          EOF

      - name: Sanity-build packages.bin
        if: steps.ver.outputs.changed == 'true'
        run: nix --extra-experimental-features 'nix-command flakes' build .#bin -L

      - name: Open pull request
        if: steps.ver.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "flake: update kaledis release info to v${{ steps.ver.outputs.latest }}"
          title: "Update kaledis release to v${{ steps.ver.outputs.latest }}"
          body: |
            Automated update after the `v${{ steps.ver.outputs.latest }}` release was published.

            - Previous version: `${{ steps.ver.outputs.current }}`
            - New version: `${{ steps.ver.outputs.latest }}`
            - `packages.bin` asset URLs/hashes regenerated from the release
              artifacts and verified with `nix build .#bin` on `x86_64-linux`;
              `flake-check.yml` will verify the macOS assets once this PR is
              opened.
          branch: "bot/update-kaledis-v${{ steps.ver.outputs.latest }}"
          delete-branch: true
          labels: |
            automated
            dependencies
